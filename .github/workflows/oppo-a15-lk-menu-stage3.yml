name: Oppo A15 LK menu reachability analysis stage 3
on:
  push:
    paths:
      - 'tools/analyze_oppo_a15_lk_stage3.py'
      - '.github/workflows/oppo-a15-lk-menu-stage3.yml'
  workflow_dispatch:
    inputs:
      image_path:
        description: "Original LK image path in repository"
        required: true
        default: "oppo-a15-signed-test.img"
      entry_address:
        description: "Known platform-init entry VA"
        required: true
        default: "0x480028B0"
      max_instructions:
        description: "Maximum reachable instructions to decode"
        required: true
        default: "500000"
permissions:
  contents: read
jobs:
  stage3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check capstone
      - name: Follow reachable ARM/Thumb control flow from platform-init seed
        env:
          IMAGE_PATH: ${{ inputs.image_path || 'oppo-a15-signed-test.img' }}
          ENTRY_ADDRESS: ${{ inputs.entry_address || '0x480028B0' }}
          MAX_INSTRUCTIONS: ${{ inputs.max_instructions || '500000' }}
          LOAD_BASE: "0x48000000"
          PAYLOAD_OFFSET: "0x200"
        run: python tools/analyze_oppo_a15_lk_stage3.py
      - uses: actions/upload-artifact@v4
        with:
          name: oppo-a15-lk-menu-stage3
          path: menu-xref-stage3/
          if-no-files-found: error
          retention-days: 14
