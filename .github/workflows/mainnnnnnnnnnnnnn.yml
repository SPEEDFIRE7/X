name: Build Oppo A15 recovery (CPH2185)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Device + vendor repo (owner/name)"
        required: true
        default: "SPEEDFIRE7/android_device_oppo_CPH2185"
        type: string
      device_branch:
        description: "Device tree branch"
        required: true
        default: "lineage-17.1"
        type: string
      vendor_branch:
        description: "Vendor blobs branch"
        required: true
        default: "vendor-lineage-17.1"
        type: string
      recovery_manifest:
        description: "Minimal TWRP manifest URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
        type: string
      recovery_branch:
        description: "Manifest branch"
        required: true
        default: "twrp-10.0"
        type: string
      lunch_target:
        description: "lunch target"
        required: true
        default: "twrp_CPH2185-eng"
        type: string

jobs:
  build-recovery:
    runs-on: namespace-profile-speed
    timeout-minutes: 300

    env:
      WORK: ${{ github.workspace }}/recovery
      OUT_DIR: ${{ github.workspace }}/out-artifacts

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk python3 unzip

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init recovery manifest
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          repo init -u "${{ inputs.recovery_manifest }}" -b "${{ inputs.recovery_branch }}" --depth=1

      - name: Add device and vendor trees
        run: |
          cd "$WORK"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oppo_CPH2185.xml <<EOF
          <manifest>
            <remote name="github" fetch="https://github.com/" />
            <project name="${{ inputs.repo }}" path="device/oppo/CPH2185" remote="github" revision="${{ inputs.device_branch }}" />
            <project name="${{ inputs.repo }}" path="vendor/oppo/CPH2185" remote="github" revision="${{ inputs.vendor_branch }}" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd "$WORK"
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Verify device and vendor trees
        run: |
          cd "$WORK"
          test -f device/oppo/CPH2185/BoardConfig.mk || { echo "BoardConfig.mk missing"; exit 1; }
          test -f device/oppo/CPH2185/twrp_CPH2185.mk || { echo "twrp_CPH2185.mk missing"; exit 1; }
          test -d vendor/oppo/CPH2185/proprietary || { echo "vendor blobs missing"; exit 1; }

      - name: Build recovery
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd "$WORK"
          ccache -M 50G || true
          source build/envsetup.sh
          lunch "${{ inputs.lunch_target }}"
          mka recoveryimage -j$(nproc)

      - name: Collect output
        run: |
          cd "$WORK"
          mkdir -p "$OUT_DIR"
          IMG=out/target/product/CPH2185/recovery.img
          test -f "$IMG" || { echo "recovery.img not produced"; exit 1; }
          cp "$IMG" "$OUT_DIR/"
          sha256sum "$OUT_DIR/recovery.img" > "$OUT_DIR/recovery.img.sha256"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: oppo-a15-recovery
          path: ${{ env.OUT_DIR }}
          retention-days: 14
