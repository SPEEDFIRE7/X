name: Build Device Tree and Vendor Blobs

on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: "Direct firmware URL (zip/7z/tar). Pixeldrain page links (/u/ID) are converted automatically"
        required: true
        default: "https://pixeldrain.com/u/9KKANnD5"
        type: string
      brand:
        description: "Brand (folder name)"
        required: true
        default: "infinix"
        type: string
      device:
        description: "Device codename (folder name)"
        required: true
        default: "X6528"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Show disk space
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full lz4 brotli unzip zip \
            android-sdk-libsparse-utils erofs-utils rsync git
          pip install --upgrade pip
          pip install dumpyara aospdtgen

      - name: Download firmware
        env:
          DUMP_URL: ${{ inputs.dump_url }}
        run: |
          URL="$DUMP_URL"
          # https://pixeldrain.com/u/ID -> https://pixeldrain.com/api/file/ID?download
          if [[ "$URL" =~ pixeldrain\.com/u/([A-Za-z0-9]+) ]]; then
            URL="https://pixeldrain.com/api/file/${BASH_REMATCH[1]}?download"
          fi
          aria2c -x 8 -s 8 -k 4M --file-allocation=none -o firmware.bin "$URL"
          ls -lh firmware.bin
          file firmware.bin || true

      - name: Extract partitions (dumpyara)
        run: |
          mkdir -p dump
          python3 -m dumpyara firmware.bin -o dump
          rm -f firmware.bin
          ls dump
          df -h /

      - name: Generate device tree (aospdtgen)
        env:
          BRAND: ${{ inputs.brand }}
          DEVICE: ${{ inputs.device }}
        run: |
          mkdir -p out
          # AIK cannot unpack this device's init_boot.img (dumpyara hit the same error).
          # Retry without it; vendor_boot still carries the first-stage ramdisk data.
          if ! python3 -m aospdtgen dump -o out; then
            echo "aospdtgen failed, retrying without init_boot.img"
            mkdir -p /tmp/skipped
            mv dump/init_boot.img /tmp/skipped/ 2>/dev/null || true
            rm -rf out && mkdir -p out
            python3 -m aospdtgen dump -o out
          fi
          # Show what was generated
          find out -maxdepth 3 -type d
          # Normalise the path to out/tree if the generator used another layout
          TREE_DIR="$(find out -maxdepth 3 -name BoardConfig.mk -printf '%h\n' | head -n1)"
          if [ -z "$TREE_DIR" ]; then
            echo "BoardConfig.mk not found, generation failed" >&2
            exit 1
          fi
          mkdir -p "tree/device/${BRAND}/${DEVICE}"
          rsync -a "$TREE_DIR"/ "tree/device/${BRAND}/${DEVICE}/"

      - name: Collect vendor blobs
        env:
          BRAND: ${{ inputs.brand }}
          DEVICE: ${{ inputs.device }}
        run: |
          DEST="tree/vendor/${BRAND}/${DEVICE}/proprietary"
          LIST="tree/device/${BRAND}/${DEVICE}/proprietary-files.txt"
          mkdir -p "$DEST"

          if [ -s "$LIST" ]; then
            echo "Using proprietary-files.txt generated by aospdtgen"
            copied=0; missing=0
            while IFS= read -r line; do
              # skip comments and blank lines
              case "$line" in ""|\#*) continue ;; esac
              entry="${line#-}"                 # drop leading '-'
              src="${entry%%[:|;]*}"            # drop :dest, |hash, ;flags
              if [ -f "dump/$src" ]; then
                mkdir -p "$DEST/$(dirname "$src")"
                cp -a "dump/$src" "$DEST/$src"
                copied=$((copied+1))
              else
                missing=$((missing+1))
              fi
            done < "$LIST"
            echo "copied=$copied missing=$missing"
          else
            echo "No proprietary-files.txt from aospdtgen, scanning partitions"
            : > "$LIST"
            for part in vendor odm system_ext product; do
              [ -d "dump/$part" ] || continue
              echo "# $part" >> "$LIST"
              (cd "dump/$part" && find lib lib64 bin etc firmware hw overlay \
                -type f \( -name '*.so' -o -name '*.bin' -o -name '*.mbn' \
                -o -name '*.fw' -o -name '*.xml' -o -name '*.cfg' -o -name '*.conf' \
                -o -name '*.rc' -o -perm -u+x \) 2>/dev/null) \
                | sort | while read -r f; do
                    echo "${part}/${f}" >> "$LIST"
                    mkdir -p "$DEST/${part}/$(dirname "$f")"
                    cp -a "dump/${part}/${f}" "$DEST/${part}/${f}"
                  done
            done
          fi

          wc -l "$LIST"
          du -sh "$DEST"

      - name: Package
        env:
          BRAND: ${{ inputs.brand }}
          DEVICE: ${{ inputs.device }}
        run: |
          cd tree
          zip -rq "../${BRAND}_${DEVICE}_device_tree.zip" "device/${BRAND}/${DEVICE}"
          zip -rq "../${BRAND}_${DEVICE}_vendor_blobs.zip" "vendor/${BRAND}/${DEVICE}"
          cd ..
          ls -lh *.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.brand }}-${{ inputs.device }}
          path: |
            *_device_tree.zip
            *_vendor_blobs.zip
          retention-days: 14
          compression-level: 0
