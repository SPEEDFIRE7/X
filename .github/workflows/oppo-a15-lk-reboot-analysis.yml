name: Oppo A15 LK reboot options analysis

on:
  push:
    paths:
      - 'tools/analyze_oppo_a15_lk_reboot.py'
      - '.github/workflows/oppo-a15-lk-reboot-analysis.yml'
      - 'oppo-a15-signed-test.img'
  workflow_dispatch:
    inputs:
      image_path:
        description: "LK image path in repository"
        required: true
        default: "oppo-a15-signed-test.img"
      load_base:
        description: "LK load base"
        required: true
        default: "0x48000000"
      payload_offset:
        description: "LK payload offset"
        required: true
        default: "0x200"

permissions:
  contents: read

jobs:
  analyze-reboot-options:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check capstone
      - name: Analyze reboot and key paths (read only)
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          LOAD_BASE: ${{ inputs.load_base }}
          PAYLOAD_OFFSET: ${{ inputs.payload_offset }}
        run: python tools/analyze_oppo_a15_lk_reboot.py
      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: oppo-a15-lk-reboot-analysis
          path: reboot-analysis/
          if-no-files-found: error
          retention-days: 14
