name: Oppo A15 LK menu xref stage 2
on:
  push:
    paths:
      - 'tools/analyze_oppo_a15_lk_stage2.py'
      - '.github/workflows/oppo-a15-lk-menu-stage2.yml'
  workflow_dispatch:
    inputs:
      image_path:
        description: "Original LK image path in repository"
        required: true
        default: "oppo-a15-signed-test.img"
permissions:
  contents: read
jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check capstone
      - name: Analyze string references, literal pools and code windows
        env:
          IMAGE_PATH: ${{ inputs.image_path || 'oppo-a15-signed-test.img' }}
          LOAD_BASE: "0x48000000"
          PAYLOAD_OFFSET: "0x200"
        run: python tools/analyze_oppo_a15_lk_stage2.py
      - uses: actions/upload-artifact@v4
        with:
          name: oppo-a15-lk-menu-stage2
          path: menu-xref-stage2/
          if-no-files-found: error
          retention-days: 14
