name: Download AxisGSI APK

on:
  workflow_dispatch:
    inputs:
      pixeldrain_id:
        description: "Pixeldrain file ID"
        required: true
        default: "qcumBuYf"
        type: string

permissions:
  contents: read

jobs:
  download-apk:
    runs-on: namespace-profile-speed
    timeout-minutes: 15

    steps:
      - name: Download AxisGSI APK
        env:
          PIXELDRAIN_ID: ${{ inputs.pixeldrain_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://pixeldrain.com/api/file/${PIXELDRAIN_ID}?download" \
            --output output/AxisGSI.apk
          test -s output/AxisGSI.apk
          file output/AxisGSI.apk
          unzip -t output/AxisGSI.apk
          sha256sum output/AxisGSI.apk | tee output/SHA256SUMS.txt

      - name: Upload original AxisGSI APK
        uses: actions/upload-artifact@v4
        with:
          name: AxisGSI-APK
          path: |
            output/AxisGSI.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
