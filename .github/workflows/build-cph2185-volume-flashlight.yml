name: Build CPH2185 Volume-Key Flashlight ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cph2185-volume-flashlight.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Create flashable ZIP
        run: |
          set -euo pipefail
          mkdir -p pkg/META-INF/com/google/android pkg/tools
          curl -fL --retry 3 'https://raw.githubusercontent.com/SPEEDFIRE7/X/main/.github/workflows/flashlightd-CPH2185-fixed' -o pkg/tools/flashlightd
          file pkg/tools/flashlightd
          chmod 0755 pkg/tools/flashlightd
          cat > pkg/META-INF/com/google/android/update-binary <<'SCRIPT'
          #!/sbin/sh
          # Recovery installer protocol: $1=API, $2=OUTFD, $3=ZIP path.
          OUTFD="$2"
          ZIPFILE="$3"
          ui_print() {
            if [ -n "${OUTFD:-}" ] && [ -e "/proc/self/fd/$OUTFD" ]; then
              echo "ui_print $1" > "/proc/self/fd/$OUTFD"
              echo "ui_print" > "/proc/self/fd/$OUTFD"
            fi
            echo "$1"
          }
          fail() { ui_print "ERROR: $1"; exit 1; }
          DEVICE="$(getprop ro.product.device 2>/dev/null | tr '[:upper:]' '[:lower:]')"
          [ "$DEVICE" = "cph2185" ] || ui_print "WARNING: device codename is '$DEVICE'; expected cph2185."
          [ -n "$ZIPFILE" ] && [ -f "$ZIPFILE" ] || fail "Recovery did not pass a valid ZIP path."
          GETEVENT="$(command -v getevent 2>/dev/null || true)"
          [ -n "$GETEVENT" ] || [ -x /system/bin/getevent ] || [ -x /sbin/getevent ] || fail "getevent is missing in this recovery."
          [ -e /dev/flashlight ] || fail "/dev/flashlight is missing in this recovery."
          LINKER=""
          for p in /system/bin/linker64 /sbin/linker64; do [ -x "$p" ] && LINKER="$p" && break; done
          [ -n "$LINKER" ] || fail "64-bit linker is missing in recovery."
          DAEMON="/tmp/flashlightd-cph2185"
          rm -f "$DAEMON"
          if command -v unzip >/dev/null 2>&1; then
            unzip -p "$ZIPFILE" tools/flashlightd > "$DAEMON" 2>/dev/null
          elif command -v busybox >/dev/null 2>&1; then
            busybox unzip -p "$ZIPFILE" tools/flashlightd > "$DAEMON" 2>/dev/null
          else
            fail "No unzip utility is available to extract flashlightd."
          fi
          [ -s "$DAEMON" ] || fail "flashlightd payload is missing or empty in ZIP (expected tools/flashlightd)."
          chmod 0755 "$DAEMON" || fail "Cannot make flashlightd executable."
          export LD_LIBRARY_PATH="/system/lib64:/system/lib:/vendor/lib64:/vendor/lib"
          EVENT_DEVICE="/dev/input/event1"
          [ -r "$EVENT_DEVICE" ] || fail "Volume-key input device $EVENT_DEVICE is missing or unreadable."
          ui_print "CPH2185 Flashlight controller"
          ui_print "Input device: mtk-kpd ($EVENT_DEVICE)"
          ui_print "Volume UP = ON | Volume DOWN = OFF"
          "$LINKER" "$DAEMON" daemon >/dev/null 2>&1 &
          sleep 1
          "$LINKER" "$DAEMON" off >/dev/null 2>&1 || true
          ui_print "Listening for volume-key events on $EVENT_DEVICE..."
          "$GE" -lt "$EVENT_DEVICE" 2>/dev/null | while IFS= read -r line; do
            case "$line" in
              *EV_KEY*KEY_VOLUMEUP*DOWN*)
                "$LINKER" "$DAEMON" on >/dev/null 2>&1 && ui_print "Flashlight: ON" || ui_print "ERROR: ON command failed"
                ;;
              *EV_KEY*KEY_VOLUMEDOWN*DOWN*)
                "$LINKER" "$DAEMON" off >/dev/null 2>&1 && ui_print "Flashlight: OFF" || ui_print "ERROR: OFF command failed"
                ;;
            esac
          done
          "$LINKER" "$DAEMON" off >/dev/null 2>&1 || true
          exit 0
          SCRIPT
          chmod 0755 pkg/META-INF/com/google/android/update-binary
          cat > pkg/META-INF/com/google/android/updater-script <<'EOF'
          # Volume-key flashlight controller for Oppo A15 CPH2185.
          # No partition-writing commands are included.
          EOF
          cat > pkg/README.txt <<'EOF'
          Oppo A15 CPH2185 - Volume Key Flashlight ZIP
          Volume UP: turn flashlight ON
          Volume DOWN: turn flashlight OFF
          This package does not write or repartition storage partitions.
          Experimental: requires getevent, /dev/flashlight, linker64 and
          compatible flashlightd runtime dependencies in recovery.
          EOF
          (cd pkg && zip -X -qr ../CPH2185-Volume-Flashlight.zip .)
          unzip -l CPH2185-Volume-Flashlight.zip
          unzip -p CPH2185-Volume-Flashlight.zip tools/flashlightd > /tmp/flashlightd
          cmp pkg/tools/flashlightd /tmp/flashlightd
          file /tmp/flashlightd
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPH2185-Volume-Flashlight
          path: CPH2185-Volume-Flashlight.zip
          if-no-files-found: error
          retention-days: 30
