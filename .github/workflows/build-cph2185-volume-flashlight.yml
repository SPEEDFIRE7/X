name: Build CPH2185 Volume-Key Flashlight ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cph2185-volume-flashlight.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Create flashable ZIP
        run: |
          set -euo pipefail
          mkdir -p pkg/META-INF/com/google/android pkg/tools
          curl -fL --retry 3 'https://raw.githubusercontent.com/SPEEDFIRE7/X/main/.github/workflows/flashlightd-CPH2185-fixed' -o pkg/tools/flashlightd
          file pkg/tools/flashlightd
          chmod 0755 pkg/tools/flashlightd
          cat > pkg/META-INF/com/google/android/update-binary <<'SCRIPT'
          #!/sbin/sh
          # CPH2185 volume-key flashlight controller; no partitions are modified.
          ui_print() {
            if [ -n "${OUTFD:-}" ] && [ -e "/proc/self/fd/$OUTFD" ]; then
              echo "ui_print $1" > "/proc/self/fd/$OUTFD"
              echo "ui_print" > "/proc/self/fd/$OUTFD"
            fi
            echo "$1"
          }
          fail() { ui_print "ERROR: $1"; exit 1; }
          [ "$(getprop ro.product.device 2>/dev/null)" = "CPH2185" ] || ui_print "WARNING: device codename is not CPH2185; continuing only if this is your Oppo A15."
          GETEVENT="$(command -v getevent 2>/dev/null || true)"
          [ -n "$GETEVENT" ] || [ -x /system/bin/getevent ] || [ -x /sbin/getevent ] || fail "getevent is missing in this recovery; cannot safely read volume keys."
          [ -e /dev/flashlight ] || fail "/dev/flashlight is missing. This recovery does not expose the CPH2185 flashlight driver."
          LINKER=""
          for p in /system/bin/linker64 /sbin/linker64; do [ -x "$p" ] && LINKER="$p" && break; done
          [ -n "$LINKER" ] || fail "64-bit Android linker is missing in recovery."
          BASE="$(dirname "$0")/../../../.."
          DAEMON="$BASE/tools/flashlightd"
          [ -f "$DAEMON" ] || fail "flashlightd payload not found in ZIP."
          chmod 0755 "$DAEMON"
          export LD_LIBRARY_PATH="/system/lib64:/system/lib:/vendor/lib64:/vendor/lib"
          ui_print "CPH2185 Flashlight controller"
          ui_print "Volume UP = ON | Volume DOWN = OFF"
          ui_print "Press and hold no buttons during startup; this installer will stay active until recovery terminates it."
          "$LINKER" "$DAEMON" daemon >/dev/null 2>&1 &
          sleep 1
          "$LINKER" "$DAEMON" off >/dev/null 2>&1 || true
          GE="${GETEVENT:-}"
          [ -n "$GE" ] || { [ -x /system/bin/getevent ] && GE=/system/bin/getevent || GE=/sbin/getevent; }
          "$GE" -l -t /dev/input/event* 2>/dev/null | while IFS= read -r line; do
            case "$line" in
              *KEY_VOLUMEUP*DOWN*)
                "$LINKER" "$DAEMON" on >/dev/null 2>&1 && ui_print "Flashlight: ON" || ui_print "ERROR: ON command failed"
                ;;
              *KEY_VOLUMEDOWN*DOWN*)
                "$LINKER" "$DAEMON" off >/dev/null 2>&1 && ui_print "Flashlight: OFF" || ui_print "ERROR: OFF command failed"
                ;;
            esac
          done
          "$LINKER" "$DAEMON" off >/dev/null 2>&1 || true
          exit 0
          SCRIPT
          chmod 0755 pkg/META-INF/com/google/android/update-binary
          cat > pkg/META-INF/com/google/android/updater-script <<'EOF'
          # Volume-key flashlight controller for Oppo A15 CPH2185.
          # No boot, system, vendor, userdata or partition flashing commands.
          EOF
          cat > pkg/README.txt <<'EOF'
          Oppo A15 CPH2185 - Volume Key Flashlight ZIP
          Volume UP: turn flashlight ON
          Volume DOWN: turn flashlight OFF
          This package does not write or repartition any storage partitions.
          It requires a recovery with getevent, /dev/flashlight, linker64,
          and the CPH2185-compatible flashlightd runtime dependencies.
          The package is experimental and has not been device-tested.
          EOF
          (cd pkg && zip -X -qr ../CPH2185-Volume-Flashlight.zip .)
          unzip -l CPH2185-Volume-Flashlight.zip
          unzip -p CPH2185-Volume-Flashlight.zip tools/flashlightd > /tmp/flashlightd
          cmp pkg/tools/flashlightd /tmp/flashlightd
          file /tmp/flashlightd
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPH2185-Volume-Flashlight
          path: CPH2185-Volume-Flashlight.zip
          if-no-files-found: error
          retention-days: 30
